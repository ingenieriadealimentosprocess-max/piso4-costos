<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Costeo · Piso Cuatro</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
  --txt:#e7e9ee; --muted:#9aa3b2; --accent:#c9a24b; --accent2:#e0b85c;
  --green:#3fb96b; --red:#e06666; --blue:#5b9bd5;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
header{background:linear-gradient(90deg,#15171d,#1d2128);padding:16px 24px;border-bottom:2px solid var(--accent);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
header h1{margin:0;font-size:20px;letter-spacing:.5px}
header h1 span{color:var(--accent)}
.subtitle{color:var(--muted);font-size:12px;margin-top:2px}
nav{display:flex;gap:4px;background:var(--panel);padding:8px 12px;flex-wrap:wrap;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
nav button{background:transparent;color:var(--muted);border:none;padding:9px 16px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600}
nav button:hover{background:var(--panel2);color:var(--txt)}
nav button.active{background:var(--accent);color:#1a1a1a}
main{padding:20px 24px;max-width:1300px;margin:0 auto}
.tab{display:none}.tab.active{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
.card h2{margin:0 0 4px;font-size:17px}
.card .hint{color:var(--muted);font-size:12px;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;position:sticky;top:0;background:var(--panel)}
tr:hover td{background:var(--panel2)}
.num{text-align:right;font-variant-numeric:tabular-nums}
input,select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--accent)}
input.cost{width:100px;text-align:right}
select.map{width:100%;max-width:340px}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.pill.sub{background:rgba(91,155,213,.18);color:var(--blue)}
.pill.ok{background:rgba(63,185,107,.16);color:var(--green)}
.pill.warn{background:rgba(224,102,102,.16);color:var(--red)}
.search{width:100%;max-width:360px;margin-bottom:12px;padding:9px 12px}
.kpis{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;flex:1;min-width:160px}
.kpi .v{font-size:24px;font-weight:700;color:var(--accent2)}
.kpi .l{color:var(--muted);font-size:12px;margin-top:2px}
.controls{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:16px;background:var(--panel2);padding:12px 16px;border-radius:10px}
.controls label{font-size:13px;color:var(--muted)}
.controls input{width:80px;text-align:right}
.dish{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.dish-head{padding:13px 18px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:12px;flex-wrap:wrap}
.dish-head:hover{background:var(--panel2)}
.dish-head .name{font-size:15px;font-weight:700}
.dish-head .sect{font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.5px}
.dish-body{display:none;border-top:1px solid var(--line);padding:6px 18px 16px}
.dish.open .dish-body{display:block}
.dish-metrics{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.metric{text-align:right}
.metric .v{font-size:16px;font-weight:700}
.metric .l{font-size:10px;color:var(--muted);text-transform:uppercase}
.price{color:var(--green)!important}
.foodcost-in{width:64px}
.btn{background:var(--accent);color:#1a1a1a;border:none;padding:9px 16px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px}
.btn:hover{background:var(--accent2)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.ghost:hover{color:var(--txt);border-color:var(--accent)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.foot{text-align:center;color:var(--muted);font-size:11px;padding:24px}
.tag-unmapped{color:var(--red);font-size:11px}
details summary{cursor:pointer;color:var(--accent);font-size:13px;margin:8px 0}
.scroll{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:10px}
</style>
</head>
<body>
<header>
  <div>
    <h1>Sistema de Costeo · <span>Piso Cuatro</span></h1>
    <div class="subtitle">Costeo de platos, sub-recetas y precio de venta sugerido · Datos abril–mayo 2026</div>
  </div>
  <div class="toolbar" style="margin:0;align-items:center">
    <span id="cloudStatus" style="font-size:12px;color:var(--muted)"></span>
    <button class="btn" id="editBtn" onclick="toggleEdit()" style="display:none">🔒 Editar</button>
    <button class="btn" id="saveBtn" onclick="guardarAhora()" style="display:none;background:var(--green);color:#fff">💾 Guardar</button>
    <button class="btn" onclick="exportData()">⬇ Respaldar datos</button>
    <button class="btn ghost" onclick="importData()">⬆ Restaurar</button>
    <button class="btn ghost" onclick="resetAll()">↺ Reiniciar</button>
  </div>
</header>
<div id="lockBanner" style="display:none;background:#3a2f16;color:#e0b85c;text-align:center;padding:8px;font-size:13px;border-bottom:1px solid var(--accent)"></div>
<nav id="nav"></nav>
<main>
  <div class="tab" id="tab-resumen"></div>
  <div class="tab" id="tab-rentabilidad"></div>
  <div class="tab" id="tab-platos"></div>
  <div class="tab" id="tab-subrecetas"></div>
  <div class="tab" id="tab-bebidas"></div>
  <div class="tab" id="tab-vinculacion"></div>
  <div class="tab" id="tab-insumos"></div>
  <div class="tab" id="tab-fijos"></div>
  <div class="tab" id="tab-inventario"></div>
  <div class="tab" id="tab-movimientos"></div>
  <div class="tab" id="tab-manual"></div>
</main>

function parseCSV(text){
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c=='"'){if(text[i+1]=='"'){cell+='"';i++}else q=false}else cell+=c}
    else{if(c=='"')q=true;else if(c==',' ){row.push(cell);cell=""}
    else if(c=='\n'){row.push(cell);rows.push(row);row=[];cell=""}
    else if(c=='\r'){}else cell+=c}}
  if(cell.length||row.length){row.push(cell);rows.push(row)}
  return rows;
}
let PRODUCTS=[]; // {n, cat, unit, price}
(function(){
  const raw=document.getElementById('pricesCSV').textContent;
  const rows=parseCSV(raw);
  for(const r of rows){
    const num=parseFloat(r[0]); const prod=(r[2]||"").trim();
    const val=parseFloat(r[6]);
    if(!isNaN(num)&&prod&&!isNaN(val)){
      PRODUCTS.push({n:prod,cat:(r[1]||"").replace(/^\d+\.\s*/,''),unit:(r[5]||"").trim(),price:val});
    }
  }
})();

function prodPrice(p){return STATE.priceOverride[p.n]!=null?STATE.priceOverride[p.n]:p.price;}

/* ============ NORMALIZACIÓN Y MATCHING ============ */
function norm(s){return (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();}
const STOP=new Set(["de","la","el","en","con","x","und","unidad","y","del","a","x1kg","x500g"]);
function tokens(s){return norm(s).split(" ").filter(t=>t&&!STOP.has(t));}
function score(a,b){const A=tokens(a),B=new Set(tokens(b));let s=0;for(const t of A)if(B.has(t))s+=t.length;return s;}

// estimar gramos/ml de un paquete a partir del nombre
function packSize(name){
  const n=name.toLowerCase().replace(/,/g,'.');
  let m=n.match(/x?\s*([\d.]+)\s*(kg|kl)\b/); if(m)return parseFloat(m[1])*1000;
  m=n.match(/x?\s*([\d.]+)\s*(g|gr|grs)\b/); if(m)return parseFloat(m[1]);
  m=n.match(/x?\s*([\d.]+)\s*(lt|l|lts)\b/); if(m)return parseFloat(m[1])*1000;
  m=n.match(/x?\s*([\d.]+)\s*(ml|cc)\b/); if(m)return parseFloat(m[1]);
  return null;
}
// ===== Platos y sub-recetas dinámicos (base + creados/editados por el usuario) =====
function allPlatos(){
  const base=PLATOS.filter(p=>!STATE.hiddenPlatos[p[0]]);
  const custom=(STATE.customPlatos||[]).map(cp=>[cp.n,cp.sec,cp.port||1,STATE.dishItems[cp.n]||[]]);
  return base.concat(custom);
}
function subList(){
  const base=SUBRECETAS.map(s=>[s[0], STATE.subYield[s[0]]??s[1], STATE.subItems[s[0]]||s[2]]);
  const custom=(STATE.customSubs||[]).map(cs=>[cs.n, STATE.subYield[cs.n]??(cs.y||1), STATE.subItems[cs.n]||[]]);
  return base.concat(custom);
}
let _subNames=new Set(), _subByNorm={};
function rebuildSubIndex(){_subNames=new Set();_subByNorm={};subList().forEach(s=>{const k=norm(s[0]);_subNames.add(k);_subByNorm[k]=s;});}
function isSub(k){return _subNames.has(k);}
function subByNorm(k){return _subByNorm[k];}
rebuildSubIndex();

// lista de ingredientes únicos (de platos + subrecetas), excluyendo los que son sub-recetas
function uniqueIngredients(){
  const set=new Map();
  const add=(name)=>{const k=norm(name);if(isSub(k))return;if(!set.has(k))set.set(k,name);};
  subList().forEach(s=>s[2].forEach(it=>add(it[0])));
  allPlatos().forEach(p=>p[3].forEach(it=>add(it[0])));
  return [...set.entries()].map(([k,name])=>({key:k,name}));
}
// autosugerencia de match
function suggest(ingName){
  let best=null,bs=0,bd=false;
  for(const p of activeProducts()){
    const s=score(ingName,p.n);if(s<=0)continue;
    const d=autoCostPerUnit(p,'g')!=null;          // ¿podemos deducir $/g o $/ml?
    if(s>bs || (s===bs && d && !bd)){bs=s;best=p;bd=d;}
  }
  return bs>0?best:null;
}
// costo por unidad de receta (g/ml/ud) para un ingrediente, según mapping
// unidad típica con la que se usa un ingrediente en las recetas (para vincular/costear)
function ingUnitOf(name){
  const k=norm(name);
  for(const s of SUBRECETAS)for(const it of s[2])if(norm(it[0])===k)return it[2];
  for(const p of PLATOS)for(const it of (STATE.dishItems[p[0]]||p[3]))if(norm(it[0])===k)return it[2];
  return 'g';
}
function rawCostPerUnit(ingName,recipeUnit){
  const ru=recipeUnit||ingUnitOf(ingName);
  const k=norm(ingName);
  const m=STATE.map[k];
  if(m){
    if(m.costPerUnit!=null && m.costPerUnit!=="") return parseFloat(m.costPerUnit);
    if(m.prod){const p=PRODUCTS.find(x=>x.n===m.prod);if(p)return autoCostPerUnit(p,ru);}
  }
  const s=suggest(ingName);
  return s?autoCostPerUnit(s,ru):null;
}
// factor de merma: si un ingrediente pierde X% al limpiarlo/pelarlo, el costo real sube (compras 1/(1-X))
function mermaOf(k){const m=STATE.map[k]&&parseFloat(STATE.map[k].merma);return (m>0)?Math.min(m,95):0;}
function mermaFactor(k){const m=mermaOf(k);return m>0?1/(1-m/100):1;}
function ingCostPerUnit(ingName,recipeUnit){
  const base=rawCostPerUnit(ingName,recipeUnit);
  if(base==null)return null;
  return base*mermaFactor(norm(ingName));
}
function autoCostPerUnit(p,ru){
  const price=prodPrice(p);
  if(/^(gr|g|ml)$/i.test(prodUnit(p))) return price;  // ya es $/g o $/ml
  const sz=packSize(p.n);
  if(sz) return price/sz;                            // $/g o $/ml (paquete por peso/volumen)
  if(ru==='ud') return price;                        // receta por pieza: precio = $/unidad
  return null;  // producto por paquete usado en gramos sin tamaño deducible: requiere $/unidad manual
}
function currentProdFor(ingName){
  const k=norm(ingName);const m=STATE.map[k];
  if(m&&m.prod){const p=PRODUCTS.find(x=>x.n===m.prod);if(p)return p;}
  return suggest(ingName);
}

/* ============ COSTEO ============ */
// costo por gramo de una sub-receta
const subCache={};
function subCostPerGram(subNorm){
  if(subCache[subNorm]!=null)return subCache[subNorm];
  const s=subByNorm(subNorm);if(!s)return null;
  let total=0,weight=0;
  for(const [ing,qty,unit] of s[2]){
    const k=norm(ing);
    if(isSub(k)){const cpg=subCostPerGram(k);if(cpg!=null){total+=cpg*qty;if(unit!=="ud")weight+=qty;}continue;}
    const cpu=ingCostPerUnit(ing,unit);
    if(cpu!=null){total+=cpu*qty;if(unit!=="ud")weight+=qty;}
  }
  const cpg=weight>0?total/weight:null;
  subCache[subNorm]=cpg;return cpg;
}
function subTotalCost(s){
  let total=0;
  for(const [ing,qty,unit] of s[2]){
    const k=norm(ing);
    if(isSub(k)){const cpg=subCostPerGram(k);if(cpg!=null)total+=cpg*qty;continue;}
    const cpu=ingCostPerUnit(ing,unit);if(cpu!=null)total+=cpu*qty;
  }
  return total;
}
function clearCache(){for(const k in subCache)delete subCache[k];rebuildSubIndex();}

// costea una línea de plato; devuelve {cost, prod, cpu, isSub, mapped}
function costLine(ing,qty,unit){
  const k=norm(ing);
  if(isSub(k)){
    const cpg=subCostPerGram(k);
    const c=(cpg!=null)?(unit==="ud"?0:cpg*qty):null;
    return {cost:c,isSub:true,mapped:cpg!=null,cpu:cpg,prod:"(sub-receta)"};
  }
  const p=currentProdFor(ing);
  const cpu=ingCostPerUnit(ing,unit);
  const cost=cpu!=null?cpu*qty:null;
  return {cost,isSub:false,mapped:cpu!=null,cpu,prod:p?p.n:null};
}
function dishItems(p){return STATE.dishItems[p[0]]||p[3];}
function ensureDishItems(name){if(!STATE.dishItems[name]){const p=allPlatos().find(x=>x[0]===name);STATE.dishItems[name]=(p?p[3]:[]).map(it=>it.slice());}return STATE.dishItems[name];}
function dishCost(p){
  let total=0;
  for(const [ing,qty,unit] of dishItems(p)){const l=costLine(ing,qty,unit);if(l.cost!=null)total+=l.cost;}
  return total;
}
function dishPortions(p){return STATE.dishPortions[p[0]]??p[2];}
// El precio de venta SIEMPRE se fija a mano; el food cost es un resultado.
function dishManualPrice(p){const v=STATE.dishPrice[p[0]];return (v!=null&&v!=='')?(+v||0):null;}
function dishCostPerPortion(p){return dishCost(p)/Math.max(1,dishPortions(p));}
function suggestedPrice(p){const mp=dishManualPrice(p);return (mp&&mp>0)?mp:0;}                 // precio de venta manual
function dishFoodCost(p){const mp=dishManualPrice(p);return (mp&&mp>0)?dishCostPerPortion(p)/mp*100:0;}  // food cost DERIVADO
// migración: al pasar a "solo precio manual", cada plato arranca con el precio que ya tenía
function migratePrices(){
  if(STATE.pricesMigrated)return;
  allPlatos().forEach(p=>{const nm=p[0];
    if(STATE.dishPrice[nm]==null||STATE.dishPrice[nm]===''){
      const fc=((STATE.dishFoodCost&&STATE.dishFoodCost[nm]) ?? (STATE.sectionFoodCost&&STATE.sectionFoodCost[p[1]]) ?? STATE.foodCostDefault ?? 30)/100;
      const price=fc>0?roundPrice(dishCostPerPortion(p)/fc):0;
      if(price>0)STATE.dishPrice[nm]=price;
    }});
  STATE.pricesMigrated=true;save();
}
function roundPrice(v){return Math.round(v/100)*100;}
function precioPublico(neto){return roundPrice(neto*(1+(STATE.incPct||0)/100));}

/* ============ INVENTARIO ============ */
function uid(){return 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
// items de inventario: ingredientes (g/ml/ud) + bebidas embotelladas (ud)
function invIngredients(){return uniqueIngredients().map(i=>({id:'ing:'+i.key,key:i.key,name:i.name,unit:ingUnitOf(i.name),tipo:'ing'}));}
function invBebidas(){return (STATE.bebidas||[]).map(b=>({id:'beb:'+norm(b.n),key:norm(b.n),name:b.n,unit:'ud',tipo:'beb',costo:+b.costo||0}));}
function allInvItems(){return invIngredients().concat(invBebidas());}
function invItemById(id){return allInvItems().find(x=>x.id===id);}
function stockOf(id){return (STATE.stock[id]&&+STATE.stock[id].qty)||0;}
function minOf(id){return (STATE.stock[id]&&+STATE.stock[id].min)||0;}
function unitCostForInv(it){return it.tipo==='beb'?(+it.costo||0):(rawCostPerUnit(it.name)||0);}
function itemUnitById(id){const it=invItemById(id);return it?it.unit:'';}
// peso total (g/ml) de una sub-receta, para prorratear consumo
function subTotalWeight(s){let w=0;for(const [ing,qty,unit] of s[2]){const k=norm(ing);if(isSub(k)){w+=qty;}else if(unit!=='ud'){w+=qty;}}return w;}
// explota los items de una receta a ingredientes crudos {key:{name,qty,unit}}
function explodeItems(items,factor,acc){
  for(const [ing,qty,unit] of items){
    const k=norm(ing);
    if(isSub(k)){const s=subByNorm(k);const tw=subTotalWeight(s);if(tw>0)explodeItems(s[2],factor*(qty/tw),acc);}
    else{acc[k]=acc[k]||{name:ing,qty:0,unit:unit};acc[k].qty+=qty*factor;}
  }
}
function explodeDish(p){const acc={};explodeItems(dishItems(p),1,acc);return acc;}
// registra un movimiento y ajusta stock. delta negativo = salida
function applyMov(id,itemName,unit,delta,tipo,motivo,valor){
  STATE.stock[id]=STATE.stock[id]||{qty:0,min:0};
  STATE.stock[id].qty=(+STATE.stock[id].qty||0)+delta;
  STATE.movs.push({id:uid(),ts:Date.now(),itemId:id,itemName:itemName,unit:unit,tipo:tipo,qty:delta,motivo:motivo||'',valor:(valor==null?null:+valor)});
}
// vender N porciones de un plato: descuenta ingredientes; devuelve nº de líneas afectadas
function sellDish(dishName,n,fecha){
  const p=allPlatos().find(x=>norm(x[0])===norm(dishName));if(!p)return 0;
  const ex=explodeDish(p);let c=0;
  for(const k in ex){const it=invIngredients().find(x=>x.key===k)||{id:'ing:'+k,name:ex[k].name,unit:ex[k].unit};
    applyMov(it.id,ex[k].name,ex[k].unit||it.unit,-ex[k].qty*n,'venta','Venta '+n+'× '+p[0]);c++;}
  return c;
}
function sellBebida(bebName,n){
  const it=invBebidas().find(x=>norm(x.name)===norm(bebName));if(!it)return false;
  applyMov(it.id,it.name,'ud',-n,'venta','Venta '+n+'× '+it.name);return true;
}
// empareja un nombre del POS con un plato o bebida (usa memoria posMap)
function matchPOS(posName){
  const raw=posName.trim(); const key=norm(raw);
  if(STATE.posMap[key])return STATE.posMap[key];               // ya mapeado
  // el POS suele venir "CATEGORIA - NOMBRE"; probar nombre completo y la parte tras " - "
  const cands=[raw]; const dash=raw.split(/\s-\s/); if(dash.length>1)cands.push(dash.slice(1).join(' - '));
  for(const c of cands){const nc=norm(c);
    let p=allPlatos().find(x=>norm(x[0])===nc); if(p)return {tipo:'plato',name:p[0]};
    let b=invBebidas().find(x=>norm(x.name)===nc); if(b)return {tipo:'bebida',name:b.name};
  }
  // coincidencia parcial (contiene)
  for(const c of cands){const nc=norm(c);
    let p=allPlatos().find(x=>nc.includes(norm(x[0]))||norm(x[0]).includes(nc)); if(p)return {tipo:'plato',name:p[0]};
    let b=invBebidas().find(x=>nc.includes(norm(x.name))||norm(x.name).includes(nc)); if(b)return {tipo:'bebida',name:b.name};
  }
  return null;
}
function valorInventario(){let v=0;allInvItems().forEach(it=>{v+=stockOf(it.id)*unitCostForInv(it);});return v;}

/* ---- RENTABILIDAD (margen de contribución) ---- */
function renderRentabilidad(){
  const dishes=allPlatos().map(p=>{
    const cpp=dishCostPerPortion(p),price=roundPrice(suggestedPrice(p));
    const mc=price-cpp, mcPct=price>0?mc/price*100:0;
    return {p,cpp,price,mc,mcPct,fc:dishFoodCost(p)};
  });
  const avgMC=dishes.reduce((a,d)=>a+d.mc,0)/dishes.length;
  const avgMCpct=dishes.reduce((a,d)=>a+d.mcPct,0)/dishes.length;
  const actual=fixedActual();
  const vol=STATE.volumenMes;
  const mcMes=avgMC*vol;
  const resultado=mcMes-actual;
  const equilibrio=avgMC>0?Math.ceil(actual/avgMC):0;
  let h=`<div class="kpis">
    <div class="kpi"><div class="v">${fmt(avgMC)}</div><div class="l">Margen contribución promedio / plato</div></div>
    <div class="kpi"><div class="v">${avgMCpct.toFixed(0)}%</div><div class="l">% contribución promedio</div></div>
    <div class="kpi"><div class="v">${equilibrio.toLocaleString('es-CO')}</div><div class="l">Punto de equilibrio (platos/mes)</div></div>
  </div>
  <div class="card">
    <h2>Proyección mensual del negocio</h2>
    <div class="hint">El margen de contribución (precio − costo de insumos) es lo que cada plato aporta para cubrir los costos fijos y dejar utilidad. Aquí ves si el volumen estimado alcanza a cubrir los fijos.</div>
    <div class="controls">
      <label>Platos vendidos al mes (estimado): <input type="number" id="volIn" value="${vol}" onchange="STATE.volumenMes=parseFloat(this.value)||0;save();renderRentabilidad()" style="width:110px"></label>
      <button class="btn" onclick="printReport()">🖨 Descargar / Imprimir PDF</button>
      <button class="btn ghost" onclick="exportRentabilidad()">⬇ Exportar a Excel (CSV)</button>
    </div>
    <table style="max-width:560px">
      <tr><td>Margen de contribución promedio por plato</td><td class="num">${fmt(avgMC)}</td></tr>
      <tr><td>× Platos vendidos al mes</td><td class="num">${vol.toLocaleString('es-CO')}</td></tr>
      <tr style="font-weight:700"><td>= Margen de contribución mensual</td><td class="num">${fmt(mcMes)}</td></tr>
      <tr><td>− Costos fijos mensuales</td><td class="num">${fmt(actual)}</td></tr>
      <tr style="font-weight:700;color:${resultado>=0?'var(--green)':'var(--red)'}"><td>= Resultado operativo del mes</td><td class="num">${fmt(resultado)}</td></tr>
    </table>
    <div class="hint" style="margin-top:8px">${resultado>=0?`✅ Con ${vol.toLocaleString('es-CO')} platos/mes cubres los fijos y te quedan <b>${fmt(resultado)}</b> de utilidad operativa.`:`⚠️ Con ${vol.toLocaleString('es-CO')} platos/mes NO alcanzas a cubrir los fijos (faltan ${fmt(-resultado)}). Necesitas vender al menos <b>${equilibrio.toLocaleString('es-CO')}</b> platos/mes.`}</div>
  </div>
  <div class="card"><h2>Margen de contribución por plato</h2>
  <div class="hint">Ordena mentalmente: los platos con mayor <b>% de contribución</b> son los más rentables para impulsar en la carta. Precios redondeados a $100.</div>
  <div class="scroll"><table><thead><tr><th>Plato</th><th>Sección</th><th class="num">Precio</th><th class="num">Costo insumos</th><th class="num">Margen contrib. $</th><th class="num">Margen contrib. %</th></tr></thead><tbody>`;
  let sect="";
  dishes.forEach(d=>{
    if(d.p[1]!==sect){sect=d.p[1];h+=`<tr><td colspan="6" style="background:var(--panel2);color:var(--accent);font-weight:700">${sect}</td></tr>`;}
    const col=d.mcPct>=70?'var(--green)':(d.mcPct>=60?'var(--accent2)':'var(--red)');
    h+=`<tr><td><b>${d.p[0]}</b></td><td>${d.p[1]}</td><td class="num">${fmt(d.price)}</td><td class="num">${fmt(d.cpp)}</td><td class="num">${fmt(d.mc)}</td><td class="num" style="color:${col};font-weight:700">${d.mcPct.toFixed(0)}%</td></tr>`;
  });
  h+=`</tbody></table></div></div>`;
  document.getElementById('tab-rentabilidad').innerHTML=h;
}

function refreshActive(){const a=document.querySelector('nav button.active');if(a)showTab(a.dataset.t);}

function setCostForIng(ing,val){const k=norm(ing);STATE.map[k]=STATE.map[k]||{};STATE.map[k].costPerUnit=val;save();clearCache();refreshActive();}

function delPlato(dn,isCustom){

}

        </div>
      </div>
      <div class="dish-body">
        <div class="controls">
          <label>Rendimiento (porciones): <input type="number" class="foodcost-in" value="${s[1]}" onchange="setSubYield('${E}',this.value)"></label>
          ${edited?`<button class="btn ghost" style="padding:5px 10px" onclick="resetSub('${E}')">↺ Restablecer original</button>`:''}
          ${isCustom?`<button class="btn ghost" style="padding:5px 10px" onclick="delSub('${E}')">🗑 Eliminar</button>`:''}
        </div>
        <table><thead><tr><th style="min-width:140px">Ingrediente</th><th class="num">Cant.</th><th>Und</th><th>Vinculado a (producto)</th><th class="num">$/und</th><th class="num">Costo</th><th></th></tr></thead><tbody>`;

      const costEdit = l.isSub ? `${l.cpu!=null?fmt2(l.cpu):'—'}` : `<input class="cost" style="width:80px" value="${l.cpu!=null?(+l.cpu).toFixed(2):''}" onchange="setCostForIng('${esc(ing)}',this.value)">`;

/* ---- BEBIDAS EMBOTELLADAS (reventa) ---- */
function renderBebidas(){
  const inc=STATE.incPct;
  let h=`<div class="card"><h2>Bebidas embotelladas (reventa)</h2>
  <div class="hint">Para bebidas que se compran y se revenden sin preparación (gaseosas, cervezas, aguas, vinos, licores). Ingresa el <b>costo de compra</b> y el <b>precio de venta</b>; el sistema calcula el margen y el precio al público con ${inc}% de INC.
  <br><b>¿Bebidas con receta</b> (jugos, cócteles, calientes)? Créalas en la pestaña 🍽 Platos con la categoría "Bebidas Frías" o "Bebidas Calientes" — usan recetas y sub-recetas como cualquier plato.</div>
  <div class="controls" style="background:var(--panel2)">
    <b style="color:var(--accent)">➕ Nueva bebida:</b>
    <input id="nbName" placeholder="Nombre (ej. Coca-Cola 400ml)" style="width:220px">
    <input id="nbCosto" type="number" placeholder="Costo compra" style="width:110px">
    <input id="nbPrecio" type="number" placeholder="Precio venta" style="width:110px">
    <button class="btn" onclick="addBebida()">Agregar</button>
  </div></div>`;
  const list=STATE.bebidas||[];
  if(!list.length){h+=`<div class="card"><div class="hint">Aún no hay bebidas embotelladas. Agrega la primera con el formulario de arriba.</div></div>`;}
  else{
    let tCosto=0,tPrecio=0;
    h+=`<div class="card"><div class="scroll"><table><thead><tr><th>Bebida</th><th class="num">Costo compra</th><th class="num">Precio venta</th><th class="num">Precio público (+${inc}%)</th><th class="num">Margen $</th><th class="num">Margen %</th><th></th></tr></thead><tbody>`;
    list.forEach((b,i)=>{
      const costo=+b.costo||0, precio=+b.precio||0, mg=precio-costo, mgp=precio>0?mg/precio*100:0;
      tCosto+=costo;tPrecio+=precio;
      const col=mgp>=50?'var(--green)':(mgp>=30?'var(--accent2)':'var(--red)');
      h+=`<tr>
        <td><input value="${(b.n||'').replace(/"/g,'&quot;')}" style="width:100%;max-width:260px" onchange="setBebida(${i},'n',this.value)"></td>
        <td class="num"><input class="cost" value="${costo}" onchange="setBebida(${i},'costo',this.value)"></td>
        <td class="num"><input class="cost" value="${precio}" onchange="setBebida(${i},'precio',this.value)"></td>
        <td class="num price">${fmt(precioPublico(precio))}</td>
        <td class="num">${fmt(mg)}</td>
        <td class="num" style="color:${col};font-weight:700">${mgp.toFixed(0)}%</td>
        <td><button class="btn ghost" style="padding:3px 9px" onclick="delBebida(${i})">✕</button></td>
      </tr>`;
    });
    const mgt=tPrecio-tCosto;
    h+=`<tr style="font-weight:700"><td>TOTAL (${list.length})</td><td class="num">${fmt(tCosto)}</td><td class="num">${fmt(tPrecio)}</td><td></td><td class="num">${fmt(mgt)}</td><td class="num">${tPrecio>0?(mgt/tPrecio*100).toFixed(0):0}%</td><td></td></tr>`;
    h+=`</tbody></table></div>
    <div style="margin-top:10px"><button class="btn ghost" onclick="exportBebidas()">⬇ Exportar a Excel (CSV)</button></div></div>`;
  }

}
function addBebida(){

function exportBebidas(){

function setInvQty(id,val){const nv=parseFloat(val)||0,old=stockOf(id),it=invItemById(id)||{name:id,unit:''};applyMov(id,it.name,it.unit,nv-old,'ajuste','Ajuste manual');save();renderInventario();}
function setInvMin(id,val){STATE.stock[id]=STATE.stock[id]||{qty:0,min:0};STATE.stock[id].min=parseFloat(val)||0;save();renderInventario();}

    <div class="controls">

function filterKardex(q){q=norm(q);document.querySelectorAll('#kardexTable tbody tr').forEach(tr=>{tr.style.display=tr.dataset.name.includes(q)?'':'none';});}
function regEntrada(){
  const it=findInvItemByName(document.getElementById('eItem').value); if(!it){alert('Ítem no encontrado. Escríbelo igual que en la lista.');return;}

function regVentaManual(){
  const name=document.getElementById('vItem').value.trim(); const q=parseFloat(document.getElementById('vQty').value)||1;
  if(!name){alert('Escribe el plato o bebida.');return;}

function importBulkFile(input){
  const f=input.files&&input.files[0]; if(!f)return;
  const name=f.name.toLowerCase();
  if(name.endsWith('.xlsx')||name.endsWith('.xls')){
    loadXLSX(function(){
      const rd=new FileReader();
      rd.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''});procesarRows(rows);}catch(err){alert('No pude leer el Excel: '+err.message+'\\nPrueba guardándolo como CSV.');}};
      rd.readAsArrayBuffer(f);
    });
  } else {
    const rd=new FileReader(); rd.onload=e=>procesarTexto(e.target.result); rd.readAsText(f,'utf-8');
  }
  input.value='';
}
function loadXLSX(cb){
  if(window.XLSX)return cb();
  const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  s.onload=cb; s.onerror=()=>alert('No se pudo cargar el lector de Excel (revisa tu conexión) o guarda el archivo como CSV.');
  document.head.appendChild(s);
}
function procesarBulk(){const t=document.getElementById('bulkTxt').value;if(!t.trim()){alert('Pega las filas o importa un archivo.');return;}procesarTexto(t);}
function procesarTexto(txt){
  txt=String(txt).replace(/\r/g,''); const lines=txt.split('\n').filter(l=>l.trim());
  if(!lines.length){alert('Archivo/texto vacío.');return;}
  let delim='\t'; const h=lines[0];
  if(h.indexOf('\t')<0){ delim=(h.split(';').length>=h.split(',').length)?';':','; }
  procesarRows(lines.map(l=>l.split(delim)));
}
function procesarRows(rows){
  if(!rows||!rows.length){alert('Sin datos en el archivo.');return;}
  let pi=-1,ci=-1,start=0;
  const hdr=(rows[0]||[]).map(s=>norm(String(s)));
  pi=hdr.findIndex(s=>s.includes('producto')); ci=hdr.findIndex(s=>s.includes('cantidad'));
  if(pi>=0){start=1;} else {pi=3;ci=4;}   // sin encabezado: posiciones estándar del reporte Pirpos
  if(ci<0)ci=pi+1;
  const agg={};
  for(let i=start;i<rows.length;i++){const cols=rows[i]||[];const prod=String(cols[pi]==null?'':cols[pi]).trim();if(!prod)continue;const cant=parseFloat(String(cols[ci]==null?'1':cols[ci]).replace(/\./g,'').replace(',','.'))||1;agg[prod]=(agg[prod]||0)+cant;}
  BULK=Object.keys(agg).map(prod=>({prod,cant:agg[prod],match:matchPOS(prod),manual:''}));
  if(!BULK.length){alert('No encontré filas con Producto. Revisa que el archivo tenga la columna "Producto".');return;}
  renderBulkPreview();
}
function renderBulkPreview(){
  if(!BULK.length){document.getElementById('bulkPreview').innerHTML='<div class="hint">No se detectaron filas.</div>';return;}
  const opts=allPlatos().map(p=>`plato|${p[0]}`).concat(invBebidas().map(b=>`bebida|${b.name}`));
  const sinMap=BULK.filter(r=>!r.match&&!r.manual).length;
  let h=`<table style="margin-top:10px"><thead><tr><th>Producto (POS)</th><th class="num">Cant.</th><th>Se descuenta como</th></tr></thead><tbody>`;
  BULK.forEach((r,i)=>{
    let cell;
    if(r.match){cell=`<span class="pill ok">✓ ${r.match.tipo}: ${r.match.name}</span>`;}
    else{cell=`<select onchange="setBulkMap(${i},this.value)"><option value="">— elige a qué corresponde —</option>${opts.map(o=>{const[t,n]=o.split('|');return `<option value="${o.replace(/"/g,'&quot;')}"${r.manual===o?' selected':''}>${t==='plato'?'🍽':'🥤'} ${n}</option>`}).join('')}</select>`;}
    h+=`<tr><td>${r.prod}</td><td class="num">${fmtN(r.cant)}</td><td>${cell}</td></tr>`;
  });
  h+=`</tbody></table><div style="margin-top:10px">${sinMap?`<span style="color:var(--red)">${sinMap} producto(s) sin emparejar — se ignorarán si no los asignas.</span> `:''}<button class="btn" onclick="aplicarBulk()">✅ Aplicar ventas al inventario</button></div>`;
  document.getElementById('bulkPreview').innerHTML=h;
}
function setBulkMap(i,val){BULK[i].manual=val;if(val){const[t,n]=val.split('|');STATE.posMap[norm(BULK[i].prod)]={tipo:t,name:n};}}
function aplicarBulk(){
  let okc=0,ign=0;
  BULK.forEach(r=>{const tgt=r.match||(r.manual?(function(){const[t,n]=r.manual.split('|');return {tipo:t,name:n};})():null);
    if(!tgt){ign++;return;}
    if(tgt.tipo==='plato')sellDish(tgt.name,r.cant); else sellBebida(tgt.name,r.cant);
    STATE.posMap[norm(r.prod)]=tgt; okc++;});
  save();BULK=[];

function setFixed(i,field,val){const c=fixedList()[i];if(!c)return;c[field]=field==='value'?(parseFloat(val)||0):val;save();renderFijos();}
function toggleFixed(i,checked){const c=fixedList()[i];if(!c)return;c.active=checked;save();renderFijos();}
function addFixed(){STATE.fixedCosts.push({name:'Nuevo costo',value:0,active:true});save();renderFijos();}
function delFixed(i){if(!confirm('¿Eliminar este costo fijo?'))return;STATE.fixedCosts.splice(i,1);save();renderFijos();}
function calcBe(){
  const actual=fixedActual();
  const ticket=parseFloat(document.getElementById('ticket').value)||0;
  const fc=(parseFloat(document.getElementById('beFc').value)||30)/100;
  const margenContrib=ticket*(1-fc); // ticket menos costo de insumos
  const platos=margenContrib>0?Math.ceil(actual/margenContrib):0;
  const ventas=platos*ticket;
  document.getElementById('beOut').innerHTML=`Con un ticket de <b>${fmt(ticket)}</b> y food cost <b>${(fc*100).toFixed(0)}%</b>, cada plato deja <b>${fmt(margenContrib)}</b> para cubrir costos fijos.<br>Necesitas vender ≈ <b style="color:var(--accent2)">${platos.toLocaleString('es-CO')} platos/mes</b> (≈ ${fmt(ventas)} en ventas) solo para cubrir los costos fijos actuales (${fmt(actual)}).`;
}
